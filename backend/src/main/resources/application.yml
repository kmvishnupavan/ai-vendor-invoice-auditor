server:
  port: ${PORT:8081}

spring:
  application:
    name: invoice-audit-system

  datasource:
    # Defaults to embedded H2 in PostgreSQL mode if no DB_URL is supplied,
    # or connects to PostgreSQL / MySQL seamlessly when DB_URL is provided in environment.
    url: ${DB_URL:jdbc:h2:mem:invoiceguard_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

invoiceguard:
  ai:
    # Supports real Gemini API key or fallback mock mode for offline testing
    api-key: ${AI_API_KEY:${GEMINI_API_KEY:}}
    api-url: ${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent}
    timeout-ms: ${AI_TIMEOUT_MS:15000}
    model: ${AI_MODEL:gemini-1.5-flash}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

logging:
  level:
    com.example.invoiceaudit: INFO
    org.springframework.web: INFO
